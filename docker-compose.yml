services:
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - osmnx-cache:/app/cache
      - ./data/nmd:/app/data/nmd:ro
    environment:
      PYTHONUNBUFFERED: "1"
      OSMNX_CACHE_FOLDER: /app/cache
      CDSE_CLIENT_ID: ${CDSE_CLIENT_ID:-}
      CDSE_CLIENT_SECRET: ${CDSE_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    profiles:
      - dev

  frontend-dev:
    build:
      context: ./fun-path-nextjs
      dockerfile: Dockerfile
      target: deps
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - ./fun-path-nextjs:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
      - spot-search-cache:/app/.spot-cache
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      ROUTING_API_URL: http://backend:8000
    depends_on:
      backend-dev:
        condition: service_healthy
    links:
      - backend-dev:backend
    profiles:
      - dev

  backend-prod:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - osmnx-cache:/app/cache
      - ./data/nmd:/app/data/nmd:ro
    environment:
      PYTHONUNBUFFERED: "1"
      OSMNX_CACHE_FOLDER: /app/cache
      CDSE_CLIENT_ID: ${CDSE_CLIENT_ID:-}
      CDSE_CLIENT_SECRET: ${CDSE_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    profiles:
      - prod

  frontend-prod:
    build:
      context: ./fun-path-nextjs
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    volumes:
      - spot-search-cache:/app/.spot-cache
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      ROUTING_API_URL: http://backend:8000
    depends_on:
      backend-prod:
        condition: service_healthy
    links:
      - backend-prod:backend
    profiles:
      - prod

volumes:
  osmnx-cache:
  frontend-node-modules:
  frontend-next:
  spot-search-cache:
